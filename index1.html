<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <!-- ===== OG / PWA / viewport ===== -->
  <meta property="og:image" content="https://idyllic-lollipop-889bee.netlify.app/.netlify/og-image/b230c900495cb4ee5da9560ca636ac6e.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#E8D8F0">

  <title>Сад Прогресса</title>

  <!-- ===== Fonts ===== -->
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

  <!-- ===== PWA ===== -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Сад Прогресса">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- ===== Styles ===== -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Фоновая SVG-сцена (облака, холмы, звёзды) -->
  <svg id="art" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="rg">
        <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle class="bb" cx="110" cy="120" r="170" fill="url(#rg)"/>
    <circle class="bb" cx="700" cy="260" r="190" fill="url(#rg)" style="animation-delay:-9s"/>
    <circle class="bb" cx="420" cy="30"  r="150" fill="url(#rg)" style="animation-delay:-4s"/>
    <g class="cl">
      <ellipse cx="160" cy="90"  rx="70" ry="18"/>
      <ellipse cx="190" cy="76"  rx="38" ry="16"/>
      <ellipse cx="560" cy="150" rx="80" ry="20"/>
      <ellipse cx="590" cy="134" rx="40" ry="17"/>
    </g>
    <g class="sx" fill="#fff">
      <circle class="tw" cx="90"  cy="60"  r="1.6"/>
      <circle class="tw" cx="300" cy="110" r="1.2" style="animation-delay:-1s"/>
      <circle class="tw" cx="520" cy="50"  r="1.8" style="animation-delay:-2s"/>
      <circle class="tw" cx="700" cy="120" r="1.3" style="animation-delay:-3s"/>
      <circle class="tw" cx="410" cy="200" r="1.4"/>
    </g>
    <path class="h2" d="M0 450Q140 380 300 440T620 420T800 450V600H0Z" opacity=".7"/>
    <path class="h1" d="M0 500Q180 450 380 500T800 480V600H0Z" opacity=".9"/>
    <g fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="2" stroke-linecap="round">
      <path d="M60 540q10-18 22-4M80 548q6-14 18-2M700 530q8-16 20-4M724 546q8-14 18-2"/>
    </g>
  </svg>

  <!-- Контейнеры приложения -->
  <div id="app"></div>
  <div id="ov"></div>
  <div id="toast"></div>

  <!-- ===== Scripts (порядок менять нельзя!) ===== -->
  <script src="core.js"></script>
  <script src="v4.js"></script>
  <script src="v5.js"></script>

  <!-- ===== Service Worker ===== -->
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () =>
        navigator.serviceWorker.register('/sw.js').catch(() => {})
      );
    }
  </script>

  <!-- ===== Netlify ===== -->
  <script async src="/.netlify/scripts/ar" data-netlify-deploy-id="6acbd185c15e4a8a1e65553d" data-netlify-site-id="0de3f265-1793-4876-a415-ea521d2ec243" data-agent-runner-id="6acbd13f213767ba31bacaf7"></script>
  <script async src="/.netlify/scripts/hud?variant=public" data-nf-variant="public" data-netlify-site-id="0de3f265-1793-4876-a415-ea521d2ec243" data-app-host="app.netlify.com" data-account-tier="free"></script>

    <!-- Ежедневный подарок и мягкие напоминания -->
  <div id="dailyGiftLayer" role="dialog" aria-modal="true" aria-labelledby="dailyGiftTitle">
    <section class="daily-gift-card">
      <div class="daily-gift-chest" aria-hidden="true">🎁</div>
      <h2 id="dailyGiftTitle">Небольшой подарок для тебя</h2>
      <p>Он уже здесь. Никакой спешки — просто маленькая радость, когда тебе удобно.</p>
      <div class="daily-gift-reward" id="dailyGiftReward">✨ Твой сюрприз</div>
      <div><button id="claimDailyGift" type="button">Забрать</button></div>
      <small class="daily-gift-note">Можно просто побыть здесь. Ты ничего не должен(на).</small>
    </section>
  </div>
  <div id="gentleReminderBar"><button id="enableGentleReminders" type="button">🔔 Включить напоминания</button></div>

  <script>
(() => {
  'use strict';
  const DAY = 86400000;
  const giftKey = 'sp_daily_gift_v1';
  const reminderKey = 'sp_gentle_reminder_v1';
  const messages = [
    'Твой подарок дня уже внутри. Забери, когда будет минутка',
    'Привет! Твой сад в порядке, деревья растут. Я просто проверяю, как ты. Если захочешь — заходи на чай, ничего делать не обязательно',
    'Ого, кажется, в твоем саду сегодня ночью произошло что-то интересное... Заглянешь посмотреть?',
    'У тебя есть 1 минута? Выбирай: 1) открыть сегодняшний подарок или 2) просто погладить сову в саду. Никаких сложных задач!',
    'День был долгим. Если хочешь, давай просто подышим вместе 2 минутки. Твой сад засыпает, и тебе пора отдыхать'
  ];
  const today = () => new Date().toLocaleDateString('en-CA');
  const safeGet = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } };
  const safeSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
  
  let gift = safeGet(giftKey);
  if (!gift || gift.date !== today()) {
    gift = {date:today(), type:Math.random()<.5?'dew':'seed', claimed:false};
    safeSet(giftKey,gift);
  }
  
  const layer = document.getElementById('dailyGiftLayer');
  const reward = document.getElementById('dailyGiftReward');
  const claim = document.getElementById('claimDailyGift');
  
  if (reward) {
    reward.textContent = gift.type === 'dew' ? '💧 +10 капелек' : '🌱 Семечко';
  }
  
  if (!gift.claimed && layer) {
    window.setTimeout(() => layer.classList.add('show'), 850);
  }
  
  if (claim) {
    claim.addEventListener('click', () => {
      if (gift.claimed) { layer.classList.remove('show'); return; }
      try {
        if (typeof S !== 'undefined') {
          if (gift.type === 'dew') S.dew = (Number(S.dew) || 0) + 10;
          else S.dailySeeds = (Number(S.dailySeeds) || 0) + 1;
          if (typeof save === 'function') save();
        }
      } catch (_) {}
      gift.claimed = true;
      safeSet(giftKey,gift);
      layer.classList.remove('show');
      if (typeof toast === 'function') toast(gift.type === 'dew' ? 'Подарок получен: +10 капелек 💧' : 'Подарок получен: семечко 🌱');
    });
  }

  const reminderButton = document.getElementById('enableGentleReminders');
  const updateReminderButton = () => {
    if (!reminderButton) return;
    if (!('Notification' in window)) {
      reminderButton.textContent = 'Уведомления недоступны в этом браузере';
      reminderButton.disabled = true;
      return;
    }
    reminderButton.textContent = Notification.permission === 'granted' ? '🔔 Напоминания включены' :
      Notification.permission === 'denied' ? 'Уведомления заблокированы в настройках браузера' : '🔔 Включить напоминания';
  };
  
  const showDailyReminder = () => {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const state = safeGet(reminderKey) || {};
    const day = today();
    if (state.lastDate === day) return;
    const msg = messages[Math.floor(Math.random()*messages.length)];
    try {
      new Notification('Сад Прогресса 🌿', {body:msg, icon:'./icons/icon.svg', tag:'sp-daily-gentle'});
      safeSet(reminderKey,{lastDate:day});
    } catch (_) {}
  };
  
  if (reminderButton) {
    reminderButton.addEventListener('click', async () => {
      if (!('Notification' in window)) { updateReminderButton(); return; }
      try {
        const permission = await Notification.requestPermission();
        updateReminderButton();
        if (permission === 'granted') {
          safeSet(reminderKey, safeGet(reminderKey) || {});
          if (typeof toast === 'function') toast('Напоминания включены. Они будут появляться, когда приложение открыто.');
        }
      } catch (_) { updateReminderButton(); }
    });
  }
  
  updateReminderButton();
  window.setInterval(showDailyReminder, 60 * 1000);
  window.addEventListener('focus', showDailyReminder);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) showDailyReminder(); });

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
